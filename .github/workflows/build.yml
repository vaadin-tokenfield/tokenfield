# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time

name: Build & Publish with Maven

on:
  push:
    # Every branch is built, so work in progress is verified before it reaches a
    # pull request; only main and v* tags publish anything (see the steps below).
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Superseded branch builds are pointless once a newer commit is pushed; main and
# release tags always run to completion, since they publish artifacts.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    # Branches in this repository are already built by the push event above;
    # the pull_request event is what covers pull requests from forks, whose
    # commits never land here as a push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    runs-on: ubuntu-latest
    # The browser suite is the long pole of the build; cap the job so a hung
    # browser or server fails the run in minutes instead of occupying a runner
    # for the six-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' \
              --non-recursive exec:exec)"
            case "$VERSION" in
              *-SNAPSHOT) ;;
              *) VERSION="${VERSION}-SNAPSHOT" ;;
            esac
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set Maven version
        run: mvn --batch-mode versions:set -DnewVersion=${{ steps.ver.outputs.version }} -DgenerateBackupPoms=false

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.0
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright OS dependencies
        run: sudo npx --yes playwright@1.62.0 install-deps chromium

      - name: Build
        run: mvn --batch-mode --no-transfer-progress --update-snapshots verify

      # Surefire/failsafe reports, the Cucumber HTML report and the Playwright
      # traces of failed scenarios, which are otherwise lost with the runner.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            tokenfield-demo/target/cucumber/**
            tokenfield-demo/target/playwright/**
          if-no-files-found: ignore
          retention-days: 14

      # Snapshots only: releases publish to Maven Central via the "release" profile,
      # not to GitHub Packages (which requires an authenticated PAT and can't serve
      # as the Directory's public Maven coordinate). Branch builds verify only —
      # a snapshot published from a branch would overwrite main's.
      - name: Deploy snapshot
        if: steps.ver.outputs.release == 'false' && github.ref == 'refs/heads/main'
        run: mvn --batch-mode --no-transfer-progress -DskipTests -DskipITs=true deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Directory add-on bundle
        if: steps.ver.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tokenfield-addon-zip
          path: tokenfield/target/*-addon.zip
          if-no-files-found: error

      # Re-runs setup-java to overwrite settings.xml with the Central Portal server
      # entry + import the GPG signing key. Requires org.vaadin.addons.tokenfield to
      # be a verified namespace on central.sonatype.com and these four repo secrets
      # to be set before this step will succeed.
      - name: Configure Maven Central credentials
        if: steps.ver.outputs.release == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish release to Maven Central
        if: steps.ver.outputs.release == 'true'
        run: mvn --batch-mode --no-transfer-progress -Prelease -DskipTests -DskipITs=true deploy
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
